<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Formation ambassadeurs · Punchlines</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,600;0,14..32,700;1,14..32,400&display=swap">
<style>
/* Plateforme de cours : sommaire à gauche (tiroir sur téléphone), une page à la fois au centre.
   Sobre : fonds neutres, la couleur passe par le texte en gras, pas par des aplats. */
:root {
  --bg: #fbf9f8; --side: #f5f1f0; --surface: #ffffff; --hover: #efe8ea;
  --ink: #241b22; --muted: #675b64; --line: #e7dfe1; --line-fort: #d6cbcf;
  --rose: #b4325f; --ok: #1f7a50; --voile: rgba(20, 12, 18, .45);
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #161215; --side: #1b161a; --surface: #211b20; --hover: #2b2329;
  --ink: #f2eaef; --muted: #b3a5af; --line: #352c33; --line-fort: #4a3e47;
  --rose: #f27ba6; --ok: #6fd1a2; --voile: rgba(0, 0, 0, .6);
  color-scheme: dark } }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 72px; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 17px/1.65 var(--body); -webkit-font-smoothing: antialiased; }
a { color: var(--rose); text-underline-offset: 3px; text-decoration-thickness: 1px; overflow-wrap: anywhere; }
a:hover { text-decoration-thickness: 2px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; border-radius: 4px; }
b, strong { font-weight: 700; }
.chiffres, .md table, nav a .n, nav h4 small, .moment time, .progres small, .car-pos, .barre-mobile .compte { font-variant-numeric: tabular-nums; }

/* Verrou */
#verrou { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; }
#verrou form { width: min(380px, 100%); display: grid; gap: 14px; }
#verrou h1 { font: 700 32px/1.1 var(--display); margin: 4px 0 0; }
#verrou p { margin: 0 0 6px; color: var(--muted); font-size: 16px; }
#verrou label { font-weight: 600; font-size: 15px; }
#verrou input { font: inherit; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line-fort); background: var(--surface); color: var(--ink); width: 100%; margin-top: 6px; }
#verrou input:focus { outline: 2px solid var(--rose); outline-offset: 0; border-color: transparent; }
#verrou .btn { justify-content: center; }
#verrou .err { color: var(--rose); font-weight: 700; min-height: 1.5em; font-size: 15px; }

/* Mise en page */
.app { display: grid; grid-template-columns: 296px minmax(0, 1fr); min-height: 100vh; }
aside { background: var(--side); border-right: 1px solid var(--line); position: sticky; top: 0; height: 100vh; overflow-y: auto; overscroll-behavior: contain; padding: 26px 14px 48px; }
.marque { padding: 0 10px; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.marque .eyebrow { font-size: 11px; }
.marque b { display: block; font: 700 20px/1.15 var(--display); margin-top: 6px; }
.fermer { display: none; }
.progres { margin: 18px 10px 4px; }
.progres .barre { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.progres .barre i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .3s; border-radius: 3px; }
.progres small { display: block; color: var(--muted); font-size: 13px; margin-top: 6px; }
.progres small b { color: var(--ok); }
nav h4 { display: flex; justify-content: space-between; gap: 8px; font: 700 11.5px/1.3 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 24px 10px 6px; }
nav h4 small { font: 600 12px var(--body); letter-spacing: 0; text-transform: none; }
nav a { display: flex; gap: 10px; align-items: baseline; padding: 6px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; font-size: 14.5px; line-height: 1.4; }
nav a:hover { background: var(--hover); }
nav a[aria-current="page"] { color: var(--rose); font-weight: 700; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
nav a .n { font-size: 12px; font-weight: 600; color: var(--muted); flex: none; min-width: 18px; }
nav a .v { margin-left: auto; color: var(--ok); flex: none; font-weight: 700; padding-left: 6px; }
main { min-width: 0; padding: 48px 32px 96px; }
.page { max-width: 760px; margin: 0 auto; }
.barre-mobile, .voile { display: none; }

/* Typo */
.eyebrow { font: 700 12px/1.3 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--rose); }
h1 { font: 700 clamp(28px, 4.2vw, 42px)/1.1 var(--display); margin: 10px 0 14px; letter-spacing: -.015em; text-wrap: balance; }
h2 { font: 700 24px/1.25 var(--display); margin: 48px 0 12px; letter-spacing: -.005em; text-wrap: balance; }
h3 { font: 700 19px/1.3 var(--display); margin: 32px 0 8px; }
p, ul, ol { margin: 0 0 14px; }
li { margin: 4px 0; }
li::marker { color: var(--muted); }
.lede { color: var(--muted); font-size: 18.5px; line-height: 1.6; max-width: 64ch; margin-bottom: 8px; }
.md, .prose { max-width: 68ch; }
.md h1 { margin-top: 10px; }
.md table { border-collapse: collapse; font-size: 15px; min-width: 100%; }
.tbl { overflow-x: auto; margin: 16px 0 22px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.md th, .md td { border-bottom: 1px solid var(--line); padding: 10px 14px; text-align: left; vertical-align: top; }
.md th { font-size: 13px; color: var(--muted); font-weight: 700; white-space: nowrap; }
.md tr:last-child td { border-bottom: 0; }
.md code { font-size: .88em; background: var(--hover); padding: 1px 5px; border-radius: 4px; }
.md blockquote { margin: 16px 0; padding-left: 16px; border-left: 3px solid var(--line-fort); color: var(--muted); }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 32px 0; }

/* Vidéo et moments */
.video { position: relative; aspect-ratio: 16 / 9; width: 100%; border-radius: var(--r); overflow: hidden; background: #000; margin: 22px 0 14px; }
.video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.moments { margin: 0 0 30px; }
.moments-titre { font-size: 13px; font-weight: 700; color: var(--muted); margin: 0 0 6px; }
.moments ol { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 2px 18px; }
.moments li { margin: 0; }
.moment { display: flex; gap: 12px; align-items: baseline; width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 7px 8px; margin-left: -8px; cursor: pointer; font-size: 15px; line-height: 1.4; }
.moment:hover { background: var(--hover); }
.moment time { flex: none; min-width: 42px; font-weight: 700; color: var(--rose); }

/* Encarts : un cadre fin, le titre en couleur */
.encart { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 20px 22px 8px; margin: 30px 0; }
.encart h3 { margin: 0 0 8px; font-size: 17px; }
.encart ul { padding-left: 20px; }
.encart.retenir h3 { color: var(--rose); }
.encart.punch h3 { color: var(--ok); }

/* Annexes repliables */
.annexes { margin: 36px 0 0; border-bottom: 1px solid var(--line); }
details.plus { border-top: 1px solid var(--line); }
details.plus > summary { list-style: none; cursor: pointer; font-weight: 600; padding: 14px 0; display: flex; gap: 10px; align-items: baseline; }
details.plus > summary::-webkit-details-marker { display: none; }
details.plus > summary::before { content: "›"; flex: none; width: 12px; color: var(--muted); font-weight: 700; transition: transform .15s; display: inline-block; }
details.plus[open] > summary::before { transform: rotate(90deg); }
details.plus > summary:hover { color: var(--rose); }
details.plus > .md, details.plus > p { padding: 0 0 18px 22px; }
details.plus details.plus { margin-left: 22px; }
details.plus details.plus > summary { font-weight: 400; font-size: 15px; padding: 10px 0; }
details.plus details.plus:last-child { margin-bottom: 14px; }
details.note { margin: 6px 0 8px; border-top: 0; }
details.note > summary { font-size: 14px; color: var(--muted); padding: 6px 0; }
details.note > p { font-size: 14px; color: var(--muted); max-width: 72ch; padding-bottom: 6px; }

/* Médias dans le texte */
figure.media { margin: 22px 0; }
figure.media img { max-width: 100%; max-height: min(70vh, 620px); width: auto; border-radius: 10px; border: 1px solid var(--line); display: block; }
figure.media video { width: 100%; max-width: 300px; aspect-ratio: 9 / 16; background: #000; border-radius: var(--r); display: block; }
figure.media figcaption { font-size: 14px; color: var(--muted); margin-top: 6px; max-width: 60ch; }
.charge { min-height: 120px; background: var(--hover); border-radius: 10px; }
img.charge { min-width: min(100%, 320px); }

/* Boutons */
.btn { display: inline-flex; align-items: center; gap: 8px; font: 600 15px/1.2 var(--body); padding: 11px 16px; border-radius: 10px; border: 1px solid var(--line-fort); background: var(--surface); color: var(--ink); text-decoration: none; cursor: pointer; }
.btn:hover { border-color: var(--ink); }
.btn.plein { background: var(--rose); border-color: var(--rose); color: #fff; }
@media (prefers-color-scheme: dark) { .btn.plein { color: #1b0f16; } }
.btn.plein:hover { filter: brightness(1.08); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0 28px; }

/* Bas de page : marquer comme vu, puis précédent / suivant */
.suite { margin-top: 56px; padding-top: 24px; border-top: 1px solid var(--line); display: grid; gap: 16px; }
.vu-btn { justify-self: start; display: inline-flex; align-items: center; gap: 10px; font: 600 15px/1.2 var(--body); padding: 11px 16px 11px 12px; border-radius: 10px; border: 1px solid var(--line-fort); background: var(--surface); cursor: pointer; }
.vu-btn::before { content: ""; width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--line-fort); flex: none; }
.vu-btn:hover { border-color: var(--ok); }
.vu-btn.fait { color: var(--ok); border-color: var(--ok); font-weight: 700; }
.vu-btn.fait::before { content: "✓"; border-color: var(--ok); background: var(--ok); color: var(--surface); font-size: 13px; line-height: 15px; text-align: center; }
.annexes + .suite { border-top: 0; margin-top: 28px; padding-top: 0; }
.pn { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pn a { display: grid; gap: 2px; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); color: var(--ink); text-decoration: none; line-height: 1.35; }
.pn a:hover { border-color: var(--rose); }
.pn a small { font-size: 13px; color: var(--muted); font-weight: 600; }
.pn a span { font-weight: 700; }
.pn a.suiv { text-align: right; grid-column: 2; }
.pn a.suiv small { color: var(--rose); }

/* Accueil */
.reprendre { margin: 24px 0 8px; }
.etapes { list-style: none; padding: 0; margin: 28px 0; display: grid; gap: 4px; counter-reset: e; }
.etapes li { counter-increment: e; display: grid; grid-template-columns: 32px 1fr; gap: 14px; align-items: start; margin: 0; padding: 12px 0; border-bottom: 1px solid var(--line); }
.etapes li:last-child { border-bottom: 0; }
.etapes li::before { content: counter(e); width: 32px; height: 32px; font: 700 15px/30px var(--display); text-align: center; border-radius: 50%; border: 1.5px solid var(--line-fort); color: var(--rose); }
.etapes a { font-weight: 700; font-size: 17.5px; text-decoration: none; }
.etapes a:hover { text-decoration: underline; }
.etapes span { color: var(--muted); font-size: 15.5px; display: block; margin-top: 2px; }
.note-bas { color: var(--muted); font-size: 15px; }

/* Cartes (listes de vidéos et de leçons) */
.cartes { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); margin: 18px 0; }
.carte { display: flex; flex-direction: column; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; text-decoration: none; color: var(--ink); }
.carte:hover { border-color: var(--rose); }
.carte b { font: 700 17px/1.3 var(--display); }
.carte > span:last-child { color: var(--muted); font-size: 14.5px; line-height: 1.45; }
.tag { font: 700 12px/1.3 var(--body); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.tag.fort { color: var(--rose); }
.tag.ok { color: var(--ok); }
.tag.seul { display: block; margin: -2px 0 14px; }
.robin-liste li { margin: 8px 0; }
.robin-liste .voir { white-space: nowrap; font-size: 15px; }

/* Pubs */
.pub { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 32px; padding: 36px 0; border-top: 1px solid var(--line); }
.pub:first-of-type { margin-top: 20px; }
.carrousel { position: relative; }
.pub .medias { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; border-radius: var(--r); scrollbar-width: none; background: #000; }
.pub .medias::-webkit-scrollbar { display: none; }
.pub .medias > * { scroll-snap-align: start; flex: none; width: 100%; }
.pub .medias img, .pub .medias video, .pub .medias .charge { width: 100%; display: block; aspect-ratio: 9 / 16; object-fit: cover; border-radius: 0; background: #000; }
.car-nav { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; font-size: 14px; color: var(--muted); }
.car-nav button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line-fort); background: var(--surface); cursor: pointer; font-size: 18px; line-height: 1; display: grid; place-items: center; }
.car-nav button:hover:not(:disabled) { border-color: var(--ink); }
.car-nav button:disabled { opacity: .35; cursor: default; }
.pub-tete { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; }
.pub h2 { margin: 6px 0 2px; font-size: 24px; overflow-wrap: anywhere; }
.pub .format { color: var(--muted); font-size: 15.5px; margin: 0; }
.chiffres { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 14px 18px; margin: 20px 0 24px; padding: 16px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.chiffres div { font-size: 13px; color: var(--muted); line-height: 1.3; }
.chiffres b { display: block; font: 700 22px/1.2 var(--display); color: var(--ink); white-space: nowrap; margin-bottom: 2px; }
.chiffres .cle b { color: var(--rose); }
.pub dl { margin: 0 0 14px; display: grid; gap: 4px; }
.pub dt { font-weight: 700; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-top: 12px; }
.pub dt:first-child { margin-top: 0; }
.pub dd { margin: 0; }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  aside { position: fixed; inset: 0 auto 0 0; width: min(330px, 88vw); height: 100%; z-index: 30; transform: translateX(-102%); transition: transform .22s ease; padding-top: max(20px, env(safe-area-inset-top)); padding-bottom: max(40px, env(safe-area-inset-bottom)); visibility: hidden; }
  body.menu-ouvert aside { transform: none; visibility: visible; box-shadow: 0 0 40px rgba(0,0,0,.25); }
  body.menu-ouvert { overflow: hidden; }
  .voile { position: fixed; inset: 0; background: var(--voile); z-index: 25; }
  body.menu-ouvert .voile { display: block; }
  .fermer { display: grid; place-items: center; flex: none; width: 40px; height: 40px; margin: -6px -6px 0 0; border-radius: 10px; border: 1px solid var(--line-fort); background: var(--surface); cursor: pointer; font-size: 18px; }
  .barre-mobile { display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); padding: max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left)); }
  .barre-mobile .btn { padding: 9px 13px; font-size: 15px; }
  .barre-mobile .ou { min-width: 0; flex: 1; font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .barre-mobile .compte { flex: none; font-size: 13px; font-weight: 700; color: var(--ok); }
  main { padding: 0 0 80px; }
  .page { padding: 22px max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); }
}
@media (max-width: 640px) {
  body { font-size: 16.5px; }
  .lede { font-size: 17px; }
  h2 { font-size: 22px; margin-top: 40px; }
  .video { border-radius: 10px; margin-top: 18px; }
  .moments ol { grid-template-columns: 1fr; }
  .encart { padding: 18px 16px 6px; }
  .pn { grid-template-columns: 1fr; }
  .pn a.suiv { grid-column: auto; grid-row: 1; }
  .vu-btn { justify-self: stretch; justify-content: center; }
  .pub { grid-template-columns: 1fr; gap: 18px; padding: 28px 0; }
  .carrousel { max-width: 300px; }
  details.plus > .md, details.plus > p { padding-left: 0; }
  details.plus details.plus { margin-left: 12px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div id="verrou" hidden>
  <form>
    <div class="eyebrow">Punchlines</div>
    <h1>Formation ambassadeurs</h1>
    <p>Entre le mot de passe que Harry t'a donné. Il reste enregistré sur cet appareil.</p>
    <label for="mdp">Mot de passe<input id="mdp" type="password" autocomplete="current-password" required></label>
    <button class="btn plein" type="submit">Ouvrir la formation</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>
<div class="app" id="app" hidden>
  <aside id="sommaire" aria-label="Sommaire">
    <div class="marque"><div><div class="eyebrow">Pour Nora</div><b>Formation ambassadeurs</b></div>
      <button class="fermer" id="fermer" type="button" aria-label="Fermer le sommaire">✕</button></div>
    <div class="progres"><div class="barre"><i id="barre"></i></div><small id="progres-txt"></small></div>
    <nav id="nav"></nav>
  </aside>
  <div class="voile" id="voile"></div>
  <main>
    <div class="barre-mobile"><button class="btn" id="menu-btn" type="button" aria-controls="sommaire" aria-expanded="false">☰ Sommaire</button><span class="ou" id="ou"></span><span class="compte" id="compte"></span></div>
    <div class="page" id="page"></div>
  </main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
const SEL = "otRCqpdqlHwdft7dVmnjRw==";
let D = null, CLE = null;
const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function cle(mdp) {
  const base = await crypto.subtle.importKey('raw', enc.encode(mdp), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(SEL), iterations: 200000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
}
async function dechiffre(buf) {
  const u = new Uint8Array(buf);
  return crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.slice(0, 12) }, CLE, u.slice(12));
}
async function ouvrir(mdp) {
  CLE = await cle(mdp);
  const r = await fetch('d.bin', { cache: 'no-cache' });
  D = JSON.parse(dec.decode(await dechiffre(await r.arrayBuffer())));
}

// Médias chiffrés : déchiffrés à la demande, gardés en mémoire
const cacheUrl = {};
async function media(chemin) {
  if (cacheUrl[chemin]) return cacheUrl[chemin];
  const f = D.fichiers[chemin];
  if (!f) return null;
  const r = await fetch('a/' + f.bin);
  const blob = new Blob([await dechiffre(await r.arrayBuffer())], { type: f.type });
  return (cacheUrl[chemin] = URL.createObjectURL(blob));
}
function hydrate(racine) {
  racine.querySelectorAll('[data-media]').forEach(async n => {
    const u = await media(n.dataset.media);
    // #t=0.1 : la vidéo affiche sa première image au lieu d'un rectangle noir
    if (u) { n.src = n.tagName === 'VIDEO' ? u + '#t=0.1' : u; n.classList.remove('charge'); }
  });
}

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function md(txt) {
  let h = window.marked ? marked.parse(txt || '') : '<p>' + esc(txt) + '</p>';
  h = h.replace(/\{\{image:([^}]+)\}\}/g, (_, f) => `</p><figure class="media"><img class="charge" data-media="images/${f.trim()}" alt="" loading="lazy"></figure><p>`)
       .replace(/\{\{clip:([^}]+)\}\}/g, (_, f) => `</p><figure class="media"><video class="charge" data-media="clips/${f.trim()}" controls playsinline preload="metadata"></video></figure><p>`)
       .replace(/<table>/g, '<div class="tbl"><table>').replace(/<\/table>/g, '</table></div>')
       .replace(/<a href="http/g, '<a target="_blank" rel="noopener" href="http');
  return h.replace(/<p>\s*<\/p>/g, '');
}
const enLigne = x => md(x).replace(/^<p>|<\/p>\s*$/g, '');
const mmss = t => Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0');
const yt = (id, t = 0, auto = 0) => `https://www.youtube-nocookie.com/embed/${id}?rel=0&start=${Math.floor(t)}${auto ? '&autoplay=1' : ''}`;
function lecteur(id, moments, titre) {
  return `<div class="video"><iframe data-yt="${id}" src="${yt(id)}" title="${esc(titre || 'Vidéo')}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe></div>` +
    (moments && moments.length ? `<div class="moments"><div class="moments-titre">Aller directement à un moment</div><ol>${moments.map(m => `<li><button class="moment" type="button" data-saut="${id}" data-t="${m.t}"><time>${mmss(m.t)}</time><span>${esc(m.label)}</span></button></li>`).join('')}</ol></div>` : '');
}
document.addEventListener('click', e => {
  const c = e.target.closest('[data-saut]');
  if (!c) return;
  const f = document.querySelector(`iframe[data-yt="${c.dataset.saut}"]`);

// Carrousels de slides (pubs) : boutons et compteur
function carPos(m) {
  const car = m.closest('.carrousel'), n = m.children.length, i = Math.round(m.scrollLeft / (m.clientWidth || 1));
  const pos = car.querySelector('.car-pos');
  if (pos) pos.textContent = `${i + 1} / ${n}`;

}
document.addEventListener('click', e => {

// Suivi des leçons vues, sur cet appareil

let P = [];
function navRender(actif) {

    }

  const a = nav.querySelector('[aria-current]'), aside = document.getElementById('sommaire');

}

function annexes(liste) { const h = liste.filter(Boolean).join(''); return h ? `<div class="annexes">${h}</div>` : ''; }

V.agent = () => `<div class="eyebrow">Ressources</div><h1>Tout télécharger</h1>

function menu(ouvert) {
  document.body.classList.toggle('menu-ouvert', ouvert);
  document.getElementById('menu-btn').setAttribute('aria-expanded', ouvert ? 'true' : 'false');
  if (ouvert) { navRender((location.hash || '#accueil').slice(1)); document.getElementById('fermer').focus(); }
}
function afficher() {

  const id = (location.hash || '#accueil').slice(1);

  if (V[id]) h = V[id]();
  else if (id.startsWith('sge-')) { const l = D.cours.lecons.find(x => 'sge-' + x.num === id); h = l && vueLecon(l); }
  else if (id.startsWith('robin-')) { const v = D.robin.videos.find(x => 'robin-' + x.id === id); h = v && vueRobin(v); }
  else if (id.startsWith('plutus-')) { const i = D.plutus.lecons.findIndex(x => 'plutus-' + x.id === id); h = i >= 0 && vuePlutus(D.plutus.lecons[i], i); }
  if (!h) { location.hash = 'accueil'; return; }
  const page = document.getElementById('page');
  page.innerHTML = h + (P.some(p => p.id === id) ? suite(id) : '');
  hydrate(page);
  page.querySelectorAll('.carrousel .medias').forEach(carPos);
  navRender(id);
  menu(false);
  window.scrollTo(0, 0);
  const t = P.find(p => p.id === id);
  document.title = (t ? t.titre + ' · ' : '') + 'Formation ambassadeurs';
  const dl = document.getElementById('dl-kit');
  if (dl) dl.onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([D.kit_md], { type: 'text/markdown' }));
    a.download = 'kit-ambassadeurs-punchlines.md'; a.click();
  };
}

document.getElementById('fermer').onclick = () => { menu(false); document.getElementById('menu-btn').focus(); };

document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.body.classList.contains('menu-ouvert')) { menu(false); document.getElementById('menu-btn').focus(); } });
window.addEventListener('hashchange', afficher);

async function demarrer(mdp) {
  await ouvrir(mdp);
  try { localStorage.setItem('kit-nora-cle', mdp); } catch {}
  document.getElementById('verrou').hidden = true;
  document.getElementById('app').hidden = false;
  P = pages();
  afficher();
}
(async () => {
  let mdp = null;
  const m = location.hash.match(/^#k=(.+)$/);
  if (m) { mdp = decodeURIComponent(m[1]); history.replaceState(null, '', location.pathname); }
  if (!mdp) try { mdp = localStorage.getItem('kit-nora-cle'); } catch {}
  if (mdp) { try { await demarrer(mdp); return; } catch {} }
  document.getElementById('verrou').hidden = false;
  document.getElementById('mdp').focus();
  document.querySelector('#verrou form').onsubmit = async e => {
    e.preventDefault();
    const b = e.target.querySelector('button'), err = document.getElementById('err');
    err.textContent = ''; b.disabled = true; b.textContent = 'Ouverture…';
    try { await demarrer(document.getElementById('mdp').value.trim()); }
    catch { err.textContent = 'Ce mot de passe ne marche pas.'; b.disabled = false; b.textContent = 'Ouvrir la formation'; }
  };
})();
