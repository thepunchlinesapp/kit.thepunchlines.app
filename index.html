<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Formation ambassadeurs · Punchlines</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Plateforme de cours : barre latérale de modules, une leçon à la fois au centre. */
:root {
  --bg: #fbf6f7; --side: #f4e9ed; --surface: #ffffff; --ink: #2b1d2a; --muted: #6f5f6d;
  --rose: #c2416f; --rose-soft: #f6dfe7; --line: #ead9df; --ok: #2f7d5b; --ok-soft: #dcefe5;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #1b1419; --side: #221920; --surface: #271d25; --ink: #f3e8ee; --muted: #b7a4b1;
  --rose: #f07aa5; --rose-soft: #3a2230; --line: #3a2c36; --ok: #6fd1a2; --ok-soft: #1f3a2d; color-scheme: dark } }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 17px/1.6 var(--body); }
a { color: var(--rose); text-underline-offset: 3px; overflow-wrap: anywhere; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; }

/* Verrou */
#verrou { min-height: 100vh; display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-left)); }
#verrou form { width: min(400px, 100%); display: grid; gap: 14px; }
#verrou h1 { font: 700 34px/1.05 var(--display); margin: 0; }
#verrou p { margin: 0; color: var(--muted); }
#verrou input { font: inherit; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
#verrou .err { color: var(--rose); min-height: 1.4em; }

/* Mise en page */
.app { display: grid; grid-template-columns: 300px 1fr; min-height: 100vh; }
aside { background: var(--side); border-right: 1px solid var(--line); position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 24px 14px 40px; }
.marque { padding: 0 10px 18px; }
.marque .eyebrow { font: 700 11px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--rose); }
.marque b { display: block; font: 700 22px/1.1 var(--display); margin-top: 8px; }
.progres { margin: 14px 10px 6px; }
.progres .barre { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.progres .barre i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .3s; }
.progres small { color: var(--muted); font-size: 13px; }
nav h4 { font: 700 12px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 22px 10px 8px; }
nav a { display: flex; gap: 10px; align-items: baseline; padding: 7px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; font-size: 15px; line-height: 1.35; }
nav a:hover { background: var(--rose-soft); }
nav a[aria-current="page"] { background: var(--surface); box-shadow: inset 3px 0 0 var(--rose); font-weight: 700; }
nav a .n { font: 600 12px var(--mono); color: var(--muted); flex: none; width: 20px; }
nav a .v { margin-left: auto; color: var(--ok); flex: none; font-weight: 700; }
main { min-width: 0; padding: 40px max(16px, env(safe-area-inset-right)) 100px max(16px, env(safe-area-inset-left)); }
.page { max-width: 820px; margin: 0 auto; }
.menu-btn { display: none; }

/* Contenu */
.eyebrow { font: 700 12px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--rose); }
h1 { font: 700 clamp(30px, 5vw, 44px)/1.05 var(--display); margin: 10px 0 14px; letter-spacing: -.015em; text-wrap: balance; }
h2 { font: 700 24px/1.2 var(--display); margin: 44px 0 12px; text-wrap: balance; }
h3 { font: 700 19px/1.3 var(--display); margin: 30px 0 8px; }
.lede { color: var(--muted); font-size: 19px; max-width: 62ch; }
.md p, .md li { max-width: 68ch; }
.md table { border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 15px; }
.tbl { overflow-x: auto; margin: 14px 0; }
.md th, .md td { border-bottom: 1px solid var(--line); padding: 8px 16px 8px 0; text-align: left; vertical-align: top; }
.md code { font: 14px var(--mono); background: var(--rose-soft); padding: 1px 5px; border-radius: 4px; }
.md blockquote { margin: 0; padding-left: 14px; border-left: 3px solid var(--line); color: var(--muted); }
.video { position: relative; aspect-ratio: 16 / 9; width: 100%; border-radius: 14px; overflow: hidden; background: #000; margin: 18px 0 10px; }
.video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 24px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 14px; cursor: pointer; text-align: left; }
.chip b { font: 600 13px var(--mono); color: var(--rose); margin-right: 6px; }
.chip:hover { border-color: var(--rose); }
.encart { border-radius: 14px; padding: 18px 20px; margin: 26px 0; }
.encart h3 { margin: 0 0 8px; font-size: 17px; }
.encart ul { margin: 0; padding-left: 20px; }
.encart p:last-child { margin-bottom: 0; }
.encart.retenir { background: var(--rose-soft); }
.encart.punch { background: var(--ok-soft); }
.encart.punch h3 { color: var(--ok); }
details.plus { border-top: 1px solid var(--line); padding: 14px 0; }
details.plus:last-of-type { border-bottom: 1px solid var(--line); }
details.plus > summary { cursor: pointer; font-weight: 700; color: var(--muted); }
figure.media { margin: 18px 0; }
figure.media img { max-width: 100%; border-radius: 10px; border: 1px solid var(--line); display: block; }
figure.media video { width: 100%; max-width: 320px; aspect-ratio: 9 / 16; background: #000; border-radius: 12px; display: block; }
figure.media figcaption { font-size: 14px; color: var(--muted); margin-top: 6px; max-width: 60ch; }
.charge { min-height: 120px; background: var(--side); border-radius: 10px; }
.suite { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; margin-top: 48px; padding-top: 22px; border-top: 1px solid var(--line); }
.btn { display: inline-flex; align-items: center; gap: 8px; font: 700 15px/1 var(--body); padding: 12px 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; cursor: pointer; }
.btn.plein { background: var(--rose); border-color: var(--rose); color: #fff; }
.btn.vu { background: var(--ok); border-color: var(--ok); color: #fff; }
.cartes { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); margin: 18px 0; }
.carte { display: block; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; text-decoration: none; color: var(--ink); }
.carte:hover { border-color: var(--rose); }
.carte b { display: block; font: 700 18px/1.25 var(--display); margin: 6px 0; }
.carte span { color: var(--muted); font-size: 15px; }
.etapes { list-style: none; padding: 0; margin: 20px 0; display: grid; gap: 12px; counter-reset: e; }
.etapes li { counter-increment: e; display: grid; grid-template-columns: 34px 1fr; gap: 12px; }
.etapes li::before { content: counter(e); font: 700 15px/34px var(--display); text-align: center; border-radius: 50%; background: var(--rose); color: #fff; }
.etapes span { color: var(--muted); font-size: 15px; display: block; }
.vid-robin { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 36px; }
.badge { display: inline-block; font: 700 12px/1 var(--body); padding: 5px 9px; border-radius: 999px; background: var(--rose-soft); color: var(--rose); letter-spacing: .02em; }
.pub { display: grid; grid-template-columns: minmax(0, 300px) 1fr; gap: 24px; padding: 28px 0; border-top: 1px solid var(--line); }
.pub .medias { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; }
.pub .medias > * { scroll-snap-align: start; flex: none; width: 100%; }
.pub .medias img, .pub .medias video { width: 100%; border-radius: 12px; display: block; background: #000; aspect-ratio: 9 / 16; object-fit: cover; }
.pub .nb { font-size: 13px; color: var(--muted); margin-top: 6px; }
.chiffres { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px 16px; margin: 12px 0 16px; }
.chiffres div { font-size: 13px; color: var(--muted); }
.chiffres b { display: block; font: 700 20px/1.2 var(--display); color: var(--ink); font-variant-numeric: tabular-nums; }
.pub dl { margin: 0; display: grid; gap: 10px; }
.pub dt { font-weight: 700; font-size: 14px; color: var(--muted); }
.pub dd { margin: 0; }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  aside { position: fixed; inset: 0 auto 0 0; width: min(320px, 86vw); z-index: 20; transform: translateX(-100%); transition: transform .2s; padding-top: max(24px, env(safe-area-inset-top)); }
  body.menu-ouvert aside { transform: none; box-shadow: 0 0 0 100vmax rgba(0,0,0,.35); }
  .menu-btn { display: inline-flex; position: sticky; top: max(10px, env(safe-area-inset-top)); z-index: 10; margin-bottom: 14px; }
  main { padding-top: 16px; }
  .pub { grid-template-columns: 1fr; }
  .pub .medias > * { width: 70%; max-width: 260px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="verrou" hidden>
  <form>
    <div class="eyebrow">Punchlines</div>
    <h1>Formation ambassadeurs</h1>
    <p>Entre le mot de passe que Harry t'a donné. Il reste enregistré sur cet appareil.</p>
    <input id="mdp" type="password" autocomplete="current-password" placeholder="Mot de passe" required>
    <button class="btn plein" type="submit">Ouvrir</button>
    <div class="err" id="err"></div>
  </form>
</div>
<div class="app" id="app" hidden>
  <aside><div class="marque"><div class="eyebrow">Pour Nora</div><b>Formation ambassadeurs</b></div>
    <div class="progres"><div class="barre"><i id="barre"></i></div><small id="progres-txt"></small></div>
    <nav id="nav"></nav>
  </aside>
  <main><button class="btn menu-btn" id="menu-btn" type="button">☰ Sommaire</button><div class="page" id="page"></div></main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
const SEL = "otRCqpdqlHwdft7dVmnjRw==";
let D = null, CLE = null;
const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function cle(mdp) {
  const base = await crypto.subtle.importKey('raw', enc.encode(mdp), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(SEL), iterations: 200000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
}
async function dechiffre(buf) {
  const u = new Uint8Array(buf);
  return crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.slice(0, 12) }, CLE, u.slice(12));
}
async function ouvrir(mdp) {
  CLE = await cle(mdp);
  const r = await fetch('d.bin', { cache: 'no-cache' });
  D = JSON.parse(dec.decode(await dechiffre(await r.arrayBuffer())));
}

// Médias chiffrés : déchiffrés à la demande, gardés en mémoire
const cacheUrl = {};
async function media(chemin) {
  if (cacheUrl[chemin]) return cacheUrl[chemin];
  const f = D.fichiers[chemin];
  if (!f) return null;
  const r = await fetch('a/' + f.bin);
  const blob = new Blob([await dechiffre(await r.arrayBuffer())], { type: f.type });
  return (cacheUrl[chemin] = URL.createObjectURL(blob));
}
function hydrate(racine) {
  racine.querySelectorAll('[data-media]').forEach(async n => {
    const u = await media(n.dataset.media);
    if (u) { n.src = u; n.classList.remove('charge'); }
  });
}

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function md(txt) {
  let h = window.marked ? marked.parse(txt || '') : '<p>' + esc(txt) + '</p>';
  h = h.replace(/\{\{image:([^}]+)\}\}/g, (_, f) => `</p><figure class="media"><img class="charge" data-media="images/${f.trim()}" alt=""></figure><p>`)
       .replace(/\{\{clip:([^}]+)\}\}/g, (_, f) => `</p><figure class="media"><video class="charge" data-media="clips/${f.trim()}" controls playsinline preload="metadata"></video></figure><p>`)
       .replace(/<table>/g, '<div class="tbl"><table>').replace(/<\/table>/g, '</table></div>')
       .replace(/<a href="http/g, '<a target="_blank" rel="noopener" href="http');
  return h.replace(/<p>\s*<\/p>/g, '');
}
const mmss = t => Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0');
const yt = (id, t = 0, auto = 0) => `https://www.youtube-nocookie.com/embed/${id}?rel=0&start=${Math.floor(t)}${auto ? '&autoplay=1' : ''}`;
function lecteur(id, moments) {
  return `<div class="video"><iframe data-yt="${id}" src="${yt(id)}" title="Vidéo" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe></div>` +
    (moments && moments.length ? `<div class="chips">${moments.map(m => `<button class="chip" data-saut="${id}" data-t="${m.t}"><b>${mmss(m.t)}</b>${esc(m.label)}</button>`).join('')}</div>` : '');
}
document.addEventListener('click', e => {
  const c = e.target.closest('[data-saut]');
  if (!c) return;
  const f = document.querySelector(`iframe[data-yt="${c.dataset.saut}"]`);
  if (f) { f.src = yt(c.dataset.saut, +c.dataset.t, 1); f.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
});

// Suivi des leçons vues, sur cet appareil
const VU = 'kit-nora-vu';
let vus = {};
try { vus = JSON.parse(localStorage.getItem(VU) || '{}'); } catch {}
const marquer = (id, v) => { if (v) vus[id] = 1; else delete vus[id]; try { localStorage.setItem(VU, JSON.stringify(vus)); } catch {} };

// Toutes les pages du parcours, dans l'ordre
function pages() {
  const P = [{ id: 'accueil', groupe: 'Démarrer', titre: 'Par où commencer' }, { id: 'programme', groupe: 'Démarrer', titre: 'Le programme et ton rôle' }];
  D.cours.lecons.forEach(l => P.push({ id: 'sge-' + l.num, groupe: 'Cours SGE', n: l.num, titre: l.titre_fr || l.titre_en, suivi: true }));
  P.push({ id: 'robin', groupe: 'Robin Dormion', titre: 'Sa méthode', suivi: true });
  D.robin.videos.forEach(v => P.push({ id: 'robin-' + v.id, groupe: 'Robin Dormion', n: String(v.rang), titre: v.titre, suivi: true }));
  P.push({ id: 'plutus', groupe: 'Plutus Media', titre: "L'essentiel", suivi: true });
  D.plutus.lecons.forEach((l, i) => P.push({ id: 'plutus-' + l.id, groupe: 'Plutus Media', n: String(i + 1), titre: l.titre, suivi: true }));
  P.push({ id: 'pubs', groupe: 'Ce qui a marché pour nous', titre: 'Nos pubs gagnantes', suivi: true });
  P.push({ id: 'agent', groupe: 'Ressources', titre: 'Tout télécharger, ton agent IA' });
  return P;
}
let P = [];
function navRender(actif) {
  let g = '', h = '';
  P.forEach(p => {
    if (p.groupe !== g) { h += `<h4>${esc(p.groupe)}</h4>`; g = p.groupe; }
    h += `<a href="#${p.id}" ${p.id === actif ? 'aria-current="page"' : ''}>${p.n ? `<span class="n">${esc(p.n)}</span>` : ''}<span>${esc(p.titre)}</span>${vus[p.id] ? '<span class="v">✓</span>' : ''}</a>`;
  });
  document.getElementById('nav').innerHTML = h;
  const suivies = P.filter(p => p.suivi), faites = suivies.filter(p => vus[p.id]).length;
  document.getElementById('barre').style.width = (100 * faites / suivies.length) + '%';
  document.getElementById('progres-txt').textContent = `${faites} sur ${suivies.length} vues`;
}
function suite(id) {
  const i = P.findIndex(p => p.id === id), av = P[i - 1], ap = P[i + 1], p = P[i];
  return `<div class="suite">${av ? `<a class="btn" href="#${av.id}">← ${esc(av.titre)}</a>` : '<span></span>'}
    <span style="display:flex;gap:10px;flex-wrap:wrap">${p.suivi ? `<button class="btn ${vus[id] ? 'vu' : ''}" data-vu="${id}">${vus[id] ? '✓ Vu' : 'Marquer comme vu'}</button>` : ''}
    ${ap ? `<a class="btn plein" href="#${ap.id}">${esc(ap.titre)} →</a>` : ''}</span></div>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-vu]');
  if (!b) return;
  const id = b.dataset.vu, v = !vus[id];
  marquer(id, v);
  if (v) { const i = P.findIndex(p => p.id === id); if (P[i + 1]) { location.hash = P[i + 1].id; return; } }
  afficher();
});

// Les vues
const V = {};
V.accueil = () => `<div class="eyebrow">Pour Nora, de la part de Harry</div><h1>Formation ambassadeurs Punchlines</h1>
  <p class="lede">Tout pour reprendre le suivi des ambassadeurs TikTok : où on en est, trois sources pour apprendre le métier et nos pubs qui ont le mieux marché.</p>
  <ol class="etapes">
    <li><div><b><a href="#programme">Le programme et ton rôle</a></b><span>L'accord avec les ambassadeurs, leur parcours, où en est chacun. 5 minutes.</span></div></li>
    <li><div><b><a href="#sge-11">Le cours SGE</a></b><span>16 leçons avec vidéo. Si tu manques de temps : leçons 05 (former), 11 (les 4 formats) et 13 (les accroches).</span></div></li>
    <li><div><b><a href="#robin">Robin Dormion</a></b><span>Sa méthode pour faire percer des débutants, puis ses vidéos les plus utiles.</span></div></li>
    <li><div><b><a href="#plutus">Plutus Media</a></b><span>Les leçons d'une agence UGC qui pilote des centaines de créateurs.</span></div></li>
    <li><div><b><a href="#pubs">Nos pubs gagnantes</a></b><span>Les posts Punchlines qui ont le mieux marché en pub, pour inspirer les ambassadeurs.</span></div></li>
  </ol>
  <p class="lede" style="font-size:16px">Ta progression se coche sur cet appareil, dans la barre de gauche.</p>`;
V.programme = () => `<div class="eyebrow">Démarrer</div>` + `<div class="md">${md(D.programme)}</div>`;
function vueLecon(l) {
  return `<div class="eyebrow">Cours SGE · leçon ${l.num}</div><h1>${esc(l.titre_fr || l.titre_en)}</h1>
    <p class="lede">${esc(l.en_bref || '')}</p>
    ${l.yt ? lecteur(l.yt, l.moments_video) : ''}
    <div class="md">${md(l.corps || '')}</div>
    ${l.a_retenir && l.a_retenir.length ? `<div class="encart retenir"><h3>À retenir</h3><ul>${l.a_retenir.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
    ${l.pour_punchlines ? `<div class="encart punch"><h3>Pour Punchlines</h3><p>${esc(l.pour_punchlines)}</p></div>` : ''}
    ${l.original ? `<details class="plus"><summary>Le texte d'origine, en anglais</summary><div class="md">${md(l.original)}</div></details>` : ''}
    ${(l.transcripts || []).map(t => `<details class="plus"><summary>${/clips/i.test(t.slice(0, 120)) ? "Les clips d'exemple, détaillés" : 'La transcription de la vidéo'}</summary><div class="md">${md(t)}</div></details>`).join('')}`;
}
V.robin = () => {
  const R = D.robin;
  return `<div class="eyebrow">Robin Dormion</div><h1>La méthode de Robin</h1>
  <p class="lede">${esc(R.chaine.presentation)} <a href="${R.chaine.url}" target="_blank" rel="noopener">Sa chaîne</a>.</p>
  ${R.methode.map(s => `<h2>${esc(s.titre)}</h2><ul>${s.points.map(p => `<li>${md(p.texte).replace(/^<p>|<\/p>\s*$/g, '')}${p.video_id ? ` <a href="#robin-${p.video_id}">(voir la vidéo${p.t != null ? ' à ' + mmss(p.t) : ''})</a>` : ''}</li>`).join('')}</ul>`).join('')}
  ${R.a_appliquer.length ? `<div class="encart punch"><h3>Ce qu'on applique dès cette semaine</h3><ul>${R.a_appliquer.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
  <h2>Ses vidéos, dans l'ordre d'utilité</h2>
  <div class="cartes">${R.videos.map(v => `<a class="carte" href="#robin-${v.id}">${v.top3 ? '<span class="badge">À voir en premier</span>' : `<span class="badge">n° ${v.rang}</span>`}<b>${esc(v.titre)}</b><span>${esc(v.duree || '')}</span></a>`).join('')}</div>`;
};
function vueRobin(v) {
  return `<div class="eyebrow">Robin Dormion · vidéo ${v.rang}${v.top3 ? ' · à voir en premier' : ''}</div><h1>${esc(v.titre)}</h1>
    <p class="lede">${esc(v.pourquoi)}</p>
    ${lecteur(v.id, v.moments)}
    <div class="encart retenir"><h3>Les idées clés</h3><ul>${v.idees.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
    ${v.transcript ? `<details class="plus"><summary>La transcription</summary><div class="md">${md(v.transcript)}</div></details>` : ''}`;
}
V.plutus = () => {
  const L = D.plutus;
  return `<div class="eyebrow">Plutus Media</div><h1>Ce que nous apprend Plutus Media</h1><p class="lede">${esc(L.intro)}</p>
  <div class="encart retenir"><h3>L'essentiel</h3><ul>${L.essentiel.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
  <h2>Les leçons</h2><div class="cartes">${L.lecons.map((l, i) => `<a class="carte" href="#plutus-${l.id}"><span class="badge">Leçon ${i + 1}</span><b>${esc(l.titre)}</b><span>${esc(l.resume)}</span></a>`).join('')}</div>`;
};
function vuePlutus(l, i) {
  return `<div class="eyebrow">Plutus Media · leçon ${i + 1}</div><h1>${esc(l.titre)}</h1><p class="lede">${esc(l.resume)}</p>
    <h2>À comprendre</h2><ul>${l.a_comprendre.map(x => `<li>${md(x).replace(/^<p>|<\/p>\s*$/g, '')}</li>`).join('')}</ul>
    ${l.exemples && l.exemples.length ? `<h2>Leurs exemples</h2><ul>${l.exemples.map(x => `<li>${md(x).replace(/^<p>|<\/p>\s*$/g, '')}</li>`).join('')}</ul>` : ''}
    ${l.pour_nora && l.pour_nora.length ? `<div class="encart punch"><h3>Pour nos ambassadeurs</h3><ul>${l.pour_nora.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
    <details class="plus"><summary>Les emails sources (${l.sources.length})</summary>${l.sources.map(s => `<details class="plus"><summary>${esc(s.date)} · ${esc(s.sujet)}</summary><div class="md">${md(D.plutus.emails[s.fichier] || '')}</div></details>`).join('')}</details>`;
}
const nb = n => n == null ? '' : Number(n).toLocaleString('fr-FR');
const eur = n => n == null ? '' : Number(n).toLocaleString('fr-FR', { maximumFractionDigits: n < 20 ? 2 : 0 }) + ' €';
V.pubs = () => {
  const G = D.pubs;
  return `<div class="eyebrow">Ce qui a marché pour nous</div><h1>Nos pubs gagnantes</h1>
  <p class="lede">Nos posts qui ont le mieux marché en pub TikTok : ceux qui ont tourné le plus longtemps, dépensé le plus et ramené des essais au meilleur prix. Tous ont été poussés en pub. Ils servent à montrer aux ambassadeurs à quoi ressemble un post Punchlines qui fonctionne.</p>
  ${G.a_retenir && G.a_retenir.length ? `<div class="encart retenir"><h3>Ce qui revient</h3><ul>${G.a_retenir.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
  <p style="color:var(--muted);font-size:14px">${esc(G.score || '')} Source : ${esc(G.source || '')}, lu le ${esc(G.lu_le || '')}.</p>
  ${G.posts.map(p => `<article class="pub">
    <div><div class="medias">${(p.medias || []).map(m => m.type === 'video' ? `<video class="charge" data-media="${m.chemin}" controls playsinline preload="metadata"></video>` : `<img class="charge" data-media="${m.chemin}" alt="Slide du post">`).join('') || '<div class="charge" style="aspect-ratio:9/16"></div>'}</div>
      ${(p.medias || []).length > 1 ? `<div class="nb">${p.medias.length} slides, fais défiler</div>` : ''}</div>
    <div><span class="badge">n° ${p.rang}${p.en_diffusion ? ' · en diffusion' : ''}</span>
      <h2 style="margin:10px 0 4px">${esc(p.compte)}</h2><div style="color:var(--muted)">${esc(p.format || p.type || '')}</div>
      <div class="chiffres">
        ${p.depense != null ? `<div><b>${eur(p.depense)}</b>dépensés</div>` : ''}
        ${p.essais != null ? `<div><b>${nb(p.essais)}</b>essais</div>` : ''}
        ${p.cout_par_essai != null ? `<div><b>${eur(p.cout_par_essai)}</b>par essai</div>` : ''}
        ${p.jours_diffusion != null ? `<div><b>${nb(p.jours_diffusion)} j</b>avec de la pub</div>` : ''}
        ${p.vues != null ? `<div><b>${nb(p.vues)}</b>vues</div>` : ''}
      </div>
      <dl>${p.accroche ? `<dt>L'accroche</dt><dd>${esc(p.accroche)}</dd>` : ''}
        ${p.pourquoi ? `<dt>Pourquoi ça a marché</dt><dd>${esc(p.pourquoi)}</dd>` : ''}
        ${p.comment_refaire ? `<dt>Comment un ambassadeur le refait</dt><dd>${esc(p.comment_refaire)}</dd>` : ''}</dl>
      <p><a href="${esc(p.lien)}" target="_blank" rel="noopener">Voir sur TikTok</a></p></div>
  </article>`).join('')}`;
};
V.agent = () => `<div class="eyebrow">Ressources</div><h1>Tout télécharger</h1>
  <p class="lede">Pour travailler avec ton agent IA (Claude, ChatGPT…), télécharge le kit en un seul fichier texte et donne-le-lui. Il contient tout : le programme, le cours en français et en anglais, les transcriptions, Robin Dormion, Plutus Media et nos pubs gagnantes.</p>
  <div class="chips" style="gap:12px"><button class="btn plein" id="dl-kit">Télécharger le kit en un fichier</button>
  ${D.dropbox ? `<a class="btn" target="_blank" rel="noopener" href="${esc(D.dropbox)}">Ouvrir le dossier Dropbox</a>` : ''}</div>
  <div class="md"><p>Le dossier Dropbox contient les fichiers d'origine : vidéos et slides de nos pubs, clips d'exemple du cours, modèle de contrat, tableurs, et chaque transcription en fichier séparé.</p></div>`;

function afficher() {
  if (!D) return;
  const id = (location.hash || '#accueil').slice(1);
  let h;
  if (V[id]) h = V[id]();
  else if (id.startsWith('sge-')) { const l = D.cours.lecons.find(x => 'sge-' + x.num === id); h = l && vueLecon(l); }
  else if (id.startsWith('robin-')) { const v = D.robin.videos.find(x => 'robin-' + x.id === id); h = v && vueRobin(v); }
  else if (id.startsWith('plutus-')) { const i = D.plutus.lecons.findIndex(x => 'plutus-' + x.id === id); h = i >= 0 && vuePlutus(D.plutus.lecons[i], i); }
  if (!h) { location.hash = 'accueil'; return; }
  const page = document.getElementById('page');
  page.innerHTML = h + (P.some(p => p.id === id) ? suite(id) : '');
  hydrate(page);
  navRender(id);
  document.body.classList.remove('menu-ouvert');
  window.scrollTo(0, 0);
  const t = P.find(p => p.id === id);
  document.title = (t ? t.titre + ' · ' : '') + 'Formation ambassadeurs';
  const dl = document.getElementById('dl-kit');
  if (dl) dl.onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([D.kit_md], { type: 'text/markdown' }));
    a.download = 'kit-ambassadeurs-punchlines.md'; a.click();
  };
}
document.getElementById('menu-btn').onclick = () => document.body.classList.toggle('menu-ouvert');
window.addEventListener('hashchange', afficher);

async function demarrer(mdp) {
  await ouvrir(mdp);
  try { localStorage.setItem('kit-nora-cle', mdp); } catch {}
  document.getElementById('verrou').hidden = true;
  document.getElementById('app').hidden = false;
  P = pages();
  afficher();
}
(async () => {
  let mdp = null;
  const m = location.hash.match(/^#k=(.+)$/);
  if (m) { mdp = decodeURIComponent(m[1]); history.replaceState(null, '', location.pathname); }
  if (!mdp) try { mdp = localStorage.getItem('kit-nora-cle'); } catch {}
  if (mdp) { try { await demarrer(mdp); return; } catch {} }
  document.getElementById('verrou').hidden = false;
  document.querySelector('#verrou form').onsubmit = async e => {
    e.preventDefault();
    try { await demarrer(document.getElementById('mdp').value.trim()); }
    catch { document.getElementById('err').textContent = 'Ce mot de passe ne marche pas.'; }
  };
})();
</script>
</body>
</html>
